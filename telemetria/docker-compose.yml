services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: telemetria
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-telemetria}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      MQTT_HOST: mqtt
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 setup.wsgi:application"

  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      MQTT_HOST: mqtt
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    command: python worker.py

volumes:
  mysql_data:
